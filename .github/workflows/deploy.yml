# Publishes site/ to GitHub Pages.
#
# There is no build step. The site is HTML and CSS that is served as written, so
# this job only uploads and deploys — which also means there is nothing here
# that can fail because a dependency changed under it.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

name: Deploy the website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queued runs are kept rather than cancelled, so a
# push made while a deploy is running still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # site/ rather than the repository root: the root also holds .git, and an
      # artifact taken from the root would publish the whole object store as
      # browsable files.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
