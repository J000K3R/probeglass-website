<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
<title>ProbeGlass</title>
<!--
  The same mark as img/logo.svg, on a tile: a favicon is often drawn on a light
  tab bar and often on a dark one, and the rounded square is what keeps it looking
  the same on both. The gauge is the canonical geometry, scaled to sit inside the
  tile rather than touching its edge.
-->
<rect width="32" height="32" rx="7" fill="#0e1116"/>
<g transform="translate(16 16) scale(0.86) translate(-16 -16)" fill="none" stroke="#60a5fa">
  <circle cx="16" cy="16" r="14" stroke-width="2.5"/>
  <path d="M16 5.5a10.5 10.5 0 0 1 0 21z" fill="#60a5fa" opacity=".18" stroke="none"/>
  <path d="M16 18.5 22.5 10" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="16" cy="18.5" r="2.2" fill="#60a5fa" stroke="none"/>
  <path d="M16 9.5v1.6M22.4 16h-1.6M16 24.5v-1.6" stroke-width="1.6"
        stroke-linecap="round" opacity=".55"/>
</g>
</svg>
